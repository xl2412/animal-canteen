services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animal_canteen
      POSTGRES_USER: animal
      POSTGRES_PASSWORD: animal_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  mqtt-data:
  postgres-data:
